<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Logo Thế Giới Đèn 98 – ba phương án</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#1B1916}a:hover{color:#B8612A}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; padding: 48px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1B1916; background: #F3EFE7; display: flex; flex-direction: column; gap: 24px;">

  <!-- Row 1: three concepts -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex: 1 1 0; min-height: 0;">

    <!-- A: Vòm sáng -->
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">A · Vòm sáng</span>
      <div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #DCD5C7; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; align-items: center; gap: 22px;">
          <svg role="img" aria-label="Biểu tượng chụp đèn và bóng sáng" viewBox="0 0 100 100" width="96" height="96"><path d="M12 54 A38 38 0 0 1 88 54 Z" fill="#1B1916"></path><circle cx="50" cy="66" r="17" fill="{{accent}}"></circle><path d="M34 92 H66" stroke="#1B1916" stroke-width="6" stroke-linecap="round"></path></svg>
          <div style="display: flex; flex-direction: column; line-height: 1;">
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 44px; font-weight: 400; letter-spacing: -0.02em;">Thế Giới Đèn</span>
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 44px; font-weight: 300; font-style: italic; letter-spacing: -0.02em; color: {{accent}}; margin-top: 2px;">98</span>
          </div>
        </div>
      </div>
    </div>

    <!-- B: Chữ ký -->
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">B · Chữ ký</span>
      <div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #DCD5C7; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: flex-start; line-height: 0.95;">
          <span style="font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 400; letter-spacing: 0.32em; text-transform: uppercase; margin-left: 4px;">Thế Giới Đèn</span>
          <span style="display: flex; align-items: flex-end; gap: 10px;">
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 128px; font-weight: 600; letter-spacing: -0.06em;">98</span>
            <svg aria-hidden="true" viewBox="0 0 40 40" width="40" height="40" style="margin-bottom: 18px;"><circle cx="20" cy="20" r="11" fill="{{accent}}"></circle><path d="M20 2v6M20 32v6M2 20h6M32 20h6M7.3 7.3l4.2 4.2M28.5 28.5l4.2 4.2M7.3 32.7l4.2-4.2M28.5 11.5l4.2-4.2" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"></path></svg>
          </span>
        </div>
      </div>
    </div>

    <!-- C: Con dấu -->
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">C · Con dấu</span>
      <div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #DCD5C7; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <svg role="img" aria-label="Con dấu tròn Thế Giới Đèn 98, An Khánh, Hà Nội" viewBox="0 0 220 220" width="240" height="240">
          <defs><path id="ringC" d="M110,110 m-84,0 a84,84 0 1,1 168,0 a84,84 0 1,1 -168,0"></path></defs>
          <circle cx="110" cy="110" r="100" fill="none" stroke="#1B1916" stroke-width="2.5"></circle>
          <circle cx="110" cy="110" r="68" fill="none" stroke="#1B1916" stroke-width="1.5"></circle>
          <text font-family="'Fraunces', Georgia, serif" font-size="14.5" font-weight="500" letter-spacing="4" fill="#1B1916"><textPath href="#ringC" startOffset="0">THẾ GIỚI ĐÈN · AN KHÁNH · HÀ NỘI · ĐÈN &amp; NỘI THẤT ·</textPath></text>
          <path d="M110 58 V84" stroke="#1B1916" stroke-width="2.5"></path>
          <path d="M88 84 H132 L146 116 H74 Z" fill="#1B1916"></path>
          <circle cx="110" cy="126" r="9" fill="{{accent}}"></circle>
          <text x="110" y="166" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="500" letter-spacing="-1" fill="#1B1916">98</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- Row 2: variants of A -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; height: 300px;">
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">A · Nền tối</span>
      <div style="flex: 1 1 0; background: #1B1916; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <svg aria-hidden="true" viewBox="0 0 100 100" width="56" height="56"><path d="M12 54 A38 38 0 0 1 88 54 Z" fill="#F3EFE7"></path><circle cx="50" cy="66" r="17" fill="{{accent}}"></circle><path d="M34 92 H66" stroke="#F3EFE7" stroke-width="6" stroke-linecap="round"></path></svg>
          <div style="display: flex; flex-direction: column; line-height: 1; color: #F3EFE7;">
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 400; letter-spacing: -0.02em;">Thế Giới Đèn</span>
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 300; font-style: italic; letter-spacing: -0.02em; color: {{accent}};">98</span>
          </div>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">A · Icon app / favicon</span>
      <div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #DCD5C7; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 20px;">
        <svg role="img" aria-label="Icon ứng dụng" viewBox="0 0 100 100" width="120" height="120"><rect width="100" height="100" rx="24" fill="#1B1916"></rect><path d="M22 54 A28 28 0 0 1 78 54 Z" fill="#F3EFE7"></path><circle cx="50" cy="64" r="13" fill="{{accent}}"></circle><path d="M38 84 H62" stroke="#F3EFE7" stroke-width="5" stroke-linecap="round"></path></svg>
        <svg aria-hidden="true" viewBox="0 0 100 100" width="48" height="48"><rect width="100" height="100" rx="24" fill="{{accent}}"></rect><path d="M22 54 A28 28 0 0 1 78 54 Z" fill="#1B1916"></path><circle cx="50" cy="64" r="13" fill="#F6E8C9"></circle><path d="M38 84 H62" stroke="#1B1916" stroke-width="5" stroke-linecap="round"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">A · Một màu (in, khắc)</span>
      <div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #DCD5C7; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <svg aria-hidden="true" viewBox="0 0 100 100" width="56" height="56"><path d="M12 54 A38 38 0 0 1 88 54 Z" fill="#1B1916"></path><circle cx="50" cy="66" r="17" fill="none" stroke="#1B1916" stroke-width="5"></circle><path d="M34 92 H66" stroke="#1B1916" stroke-width="6" stroke-linecap="round"></path></svg>
          <div style="display: flex; flex-direction: column; line-height: 1;">
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 400; letter-spacing: -0.02em;">Thế Giới Đèn</span>
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 300; font-style: italic; letter-spacing: -0.02em;">98</span>
          </div>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5952;">Màu thương hiệu</span>
      <div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #DCD5C7; border-radius: 24px; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="border-radius: 14px; background: #1B1916; color: #F3EFE7; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px;"><span style="font-weight: 500;">Than</span><span style="opacity: 0.7;">#1B1916</span></div>
        <div style="border-radius: 14px; background: {{accent}}; color: #FFFFFF; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px;"><span style="font-weight: 500;">Đất nung</span><span style="opacity: 0.85;">{{accent}}</span></div>
        <div style="border-radius: 14px; background: #F3EFE7; border: 1px solid #DCD5C7; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px;"><span style="font-weight: 500;">Kem</span><span style="color: #5E5952;">#F3EFE7</span></div>
        <div style="border-radius: 14px; background: #F6E8C9; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px;"><span style="font-weight: 500;">Ánh đèn</span><span style="color: #5E5952;">#F6E8C9</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B8612A","options":["#B8612A","#D9892F","#6B7A5E","#0068FF"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B8612A' };
  }
}
</script>
</body>
</html>
